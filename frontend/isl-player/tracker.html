<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Nea Landmark Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1C1C1E; }
    #wrap { position: relative; width: 100%; height: 100%; background: #1C1C1E; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { pointer-events: none; }
    #banner {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px;
      font: 600 12px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; color: #fff;
      background: rgba(0,0,0,0.55); text-align: center; z-index: 2;
    }
    #banner.error { background: rgba(160,30,30,0.85); }
    #banner.hidden { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="banner">Loading landmark models…</div>
  </div>
  <script type="module">
    import {
      FaceLandmarker, HandLandmarker, PoseLandmarker, FilesetResolver,
    } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const banner = document.getElementById('banner');
    const wrap = document.getElementById('wrap');

    const PURPLE = '#7850ff', TEAL = '#00d4aa', AMBER = '#ffaa30';
    const GREEN_LIP = '#4CE0A0', BLUE_EYE = '#4FA8F5', MESH = 'rgba(230,226,255,0.45)', POSE = '#ff9f45';

    const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,10];
    const LEFT_EYE = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246,33];
    const RIGHT_EYE = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398,362];
    const LEFT_BROW = [46,53,52,65,55,70,63,105,66,107];
    const RIGHT_BROW = [276,283,282,295,285,300,293,334,296,336];
    const LIPS_OUT = [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185,61];
    const LIPS_IN = [78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191,78];
    const NOSE_BRIDGE = [168,6,197,195,5,4,1,19,94,2];
    const NOSE_TIP = [279,278,344,440,275,4,45,220,115,49];
    const LEFT_IRIS = [469,470,471,472,469];
    const RIGHT_IRIS = [474,475,476,477,474];
    const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
    const FINGERTIPS = [4,8,12,16,20], PALM_POINTS = [0,5,9,13,17];
    const POSE_CONNECTIONS = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
    const POSE_JOINTS = [0,11,12,13,14,15,16];

    let faceLandmarker, handLandmarker, poseLandmarker, stream, rafId = 0, lastVideoTime = -1, lastStatusPost = 0;

    function post(msg) {
      try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (_) {}
    }
    function setBanner(text, isError) {
      if (!text) { banner.classList.add('hidden'); return; }
      banner.classList.remove('hidden');
      banner.classList.toggle('error', !!isError);
      banner.textContent = text;
    }
    function resizeCanvas() {
      const w = video.videoWidth || wrap.clientWidth;
      const h = video.videoHeight || wrap.clientHeight;
      if (w && h && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; }
    }
    function lmPx(lms, idx, w, h) { const lm = lms[idx]; return [lm.x * w, lm.y * h]; }
    function drawChain(lms, chain, color, width, w, h) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); let started = false;
      for (const i of chain) {
        if (i >= lms.length) continue;
        const [x, y] = lmPx(lms, i, w, h);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    function drawFace(lms, w, h) {
      const n = lms.length; ctx.fillStyle = MESH;
      for (let i = 0; i < Math.min(468, n); i++) {
        const [x, y] = lmPx(lms, i, w, h);
        ctx.beginPath(); ctx.arc(x, y, 1.1, 0, Math.PI * 2); ctx.fill();
      }
      drawChain(lms, FACE_OVAL, PURPLE, 2.2, w, h);
      drawChain(lms, LEFT_EYE, BLUE_EYE, 1.8, w, h);
      drawChain(lms, RIGHT_EYE, BLUE_EYE, 1.8, w, h);
      drawChain(lms, LEFT_BROW, AMBER, 2, w, h);
      drawChain(lms, RIGHT_BROW, AMBER, 2, w, h);
      drawChain(lms, NOSE_BRIDGE, AMBER, 1.6, w, h);
      drawChain(lms, NOSE_TIP, AMBER, 1.4, w, h);
      drawChain(lms, LIPS_OUT, GREEN_LIP, 2, w, h);
      drawChain(lms, LIPS_IN, GREEN_LIP, 1.4, w, h);
      if (n >= 478) {
        drawChain(lms, LEFT_IRIS, TEAL, 1.6, w, h);
        drawChain(lms, RIGHT_IRIS, TEAL, 1.6, w, h);
      }
    }
    function drawHand(lms, w, h) {
      for (const [a, b] of HAND_CONNECTIONS) {
        if (a >= lms.length || b >= lms.length) continue;
        const [x1, y1] = lmPx(lms, a, w, h), [x2, y2] = lmPx(lms, b, w, h);
        const isPalm = (a === 5 && b === 9) || (a === 9 && b === 13) || (a === 13 && b === 17) || (a === 0 && [5,9,13,17].includes(b));
        ctx.strokeStyle = isPalm ? AMBER : TEAL; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      for (let i = 0; i < lms.length; i++) {
        const [x, y] = lmPx(lms, i, w, h);
        ctx.fillStyle = FINGERTIPS.includes(i) ? PURPLE : PALM_POINTS.includes(i) ? AMBER : TEAL;
        ctx.beginPath(); ctx.arc(x, y, FINGERTIPS.includes(i) ? 4.5 : 3.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    function drawPose(lms, w, h) {
      ctx.strokeStyle = POSE; ctx.lineWidth = 2.4;
      for (const [a, b] of POSE_CONNECTIONS) {
        if (a >= lms.length || b >= lms.length) continue;
        if ((lms[a].visibility ?? 1) < 0.4 || (lms[b].visibility ?? 1) < 0.4) continue;
        const [x1, y1] = lmPx(lms, a, w, h), [x2, y2] = lmPx(lms, b, w, h);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      ctx.fillStyle = POSE;
      for (const idx of POSE_JOINTS) {
        if (idx >= lms.length || (lms[idx].visibility ?? 1) < 0.4) continue;
        const [x, y] = lmPx(lms, idx, w, h);
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    function loop() {
      rafId = requestAnimationFrame(loop);
      if (!video.videoWidth || video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      resizeCanvas();
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      let face = false, hands = 0;
      const nowMs = performance.now();
      try {
        if (faceLandmarker) {
          const fr = faceLandmarker.detectForVideo(video, nowMs);
          if (fr.faceLandmarks?.length) { face = true; drawFace(fr.faceLandmarks[0], w, h); }
        }
        if (handLandmarker) {
          const hr = handLandmarker.detectForVideo(video, nowMs);
          if (hr.landmarks) { hands = hr.landmarks.length; for (const hand of hr.landmarks) drawHand(hand, w, h); }
        }
        if (poseLandmarker) {
          const pr = poseLandmarker.detectForVideo(video, nowMs);
          if (pr.landmarks?.length) drawPose(pr.landmarks[0], w, h);
        }
      } catch (_) {}
      if (nowMs - lastStatusPost > 350) {
        lastStatusPost = nowMs;
        post({ type: 'status', face, hands, ready: true });
      }
    }
    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 1280 } },
      });
      video.srcObject = stream;
      await video.play();
    }
    function stopCamera() {
      cancelAnimationFrame(rafId);
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
      video.srcObject = null;
    }
    async function createWithFallback(Factory, modelUrl, extra) {
      const base = { modelAssetPath: modelUrl };
      try {
        return await Factory.createFromOptions(vision, { baseOptions: { ...base, delegate: 'GPU' }, runningMode: 'VIDEO', ...extra });
      } catch (_) {
        return await Factory.createFromOptions(vision, { baseOptions: { ...base, delegate: 'CPU' }, runningMode: 'VIDEO', ...extra });
      }
    }
    let vision;
    async function main() {
      try {
        post({ type: 'loading' });
        setBanner('Loading landmark models…');
        vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');
        faceLandmarker = await createWithFallback(FaceLandmarker, 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', { numFaces: 1, outputFaceBlendshapes: false, outputFacialTransformationMatrixes: false });
        handLandmarker = await createWithFallback(HandLandmarker, 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', { numHands: 2 });
        poseLandmarker = await createWithFallback(PoseLandmarker, 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', { numPoses: 1 });
        setBanner('Opening camera…');
        await startCamera();
        setBanner('');
        post({ type: 'ready' });
        loop();
      } catch (err) {
        setBanner('Tracker failed: ' + (err.message || err), true);
        post({ type: 'error', message: String(err.message || err) });
      }
    }
    window.addEventListener('pagehide', stopCamera);
    window.addEventListener('beforeunload', stopCamera);
    main();
  </script>
</body>
</html>
