<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nea Text → ISL</title>
  <link rel="stylesheet" href="css/cwasa.css" />
  <script src="js/jquery.min.js"></script>
  <script>
    // Must exist before allcsa.js (same globals as text_to_isl-main/templates/index.html)
    var initCfg = {
      avsbsl: ["luna", "siggi", "anna", "marc", "francoise"],
      avSettings: { avList: "avsbsl", initAv: "marc", width: 480, height: 400 },
      jasBase: "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/",
      useCwaConfig: false,
      useAvatarJARs: true
    };
    var tuavatarLoaded = false;
    var playerAvailableToPlay = true;
  </script>
  <script src="js/allcsa.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111827; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 8px; gap: 6px; }
    .player {
      flex: 1; min-height: 360px; background: #A3B8D2; border-radius: 16px; overflow: hidden;
      position: relative;
    }
    .anim { position: absolute; inset: 0; }
    .anim table { width: 100%; height: 100%; }
    .CWASAAvatar, .divAv {
      width: 100% !important; height: 100% !important; min-height: 360px;
      background: #A3B8D2;
    }
    .canvasAv, .CWASAAvatar canvas {
      width: 100% !important; height: 100% !important;
    }
    .controls { height: 1px; overflow: hidden; opacity: 0; }
    #meta { padding: 2px 4px 4px; }
    #current { font-size: 15px; font-weight: 700; color: #7dd3fc; min-height: 20px; }
    #gloss { font-size: 12px; color: #cbd5e1; margin-top: 4px; max-height: 44px; overflow: auto; }
    #status { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .err { color: #fca5a5; }
  </style>
</head>
<body onload="boot()">
  <div class="wrap">
    <div class="player card">
      <div class="anim">
        <table align="center" style="width:100%;height:100%;">
          <tr align="center">
            <td width="100%" height="90%">
              <div class="CWASAAvatar av0" align="center"></div>
            </td>
          </tr>
          <tr class="controls">
            <td align="center">
              <span class="CWASAAvMenu av0"></span>
              <input type="button" value="Sign" class="bttnPlaySiGMLURL av0" />
              <input type="button" value="Stop" class="bttnStop av0" />
              <span class="CWASASpeed av0"></span>
              <input type="text" id="URLText" class="txtSiGMLURL av0" value="" />
              <input class="txtSF av0" value="0/0" type="text" />
              <input class="txtGloss av0" value="[none]" type="text" />
              <input type="text" class="statusExtra av0" />
            </td>
          </tr>
        </table>
      </div>
    </div>
    <div id="meta">
      <div id="current">Loading Marc avatar…</div>
      <div id="gloss"></div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    // Playback follows text_to_isl-main/static/js/script.js (1s tick, wait for playerAvailableToPlay).
    var playTimer = null;
    var pending = null;

    function post(msg) {
      try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (e) {}
      try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {}
    }
    function setStatus(t, err) {
      var el = document.getElementById('status');
      el.textContent = t || '';
      el.className = err ? 'err' : '';
    }
    function setCurrent(t) { document.getElementById('current').textContent = t || ''; }
    function setGloss(t) { document.getElementById('gloss').textContent = t || ''; }

    function boot() {
      try {
        if (typeof CWASA === 'undefined') throw new Error('CWASA failed to load');
        CWASA.init(initCfg);
        var ticks = 0;
        var wait = setInterval(function () {
          ticks += 1;
          if (tuavatarLoaded) {
            clearInterval(wait);
            setCurrent('Avatar ready');
            setStatus('Waiting for text…');
            post({ type: 'ready', avatar: true });
            if (pending) playTokens(pending);
          } else if (ticks === 8) {
            setStatus('Downloading Marc avatar…');
          } else if (ticks > 90) {
            clearInterval(wait);
            setCurrent('Avatar still loading…');
            setStatus('Check network access to the UEA avatar server', true);
            post({ type: 'ready', avatar: false, error: 'Avatar timed out' });
          }
        }, 500);
        var hashed = tokensFromHash();
        if (hashed) pending = hashed;
      } catch (err) {
        setCurrent('Avatar unavailable');
        setStatus(String(err.message || err), true);
        post({ type: 'ready', avatar: false, error: String(err.message || err) });
      }
    }

    function setSiGMLURL(sigmlURL) {
      var loc = window.location.href.split('#')[0].split('?')[0];
      var locDir = loc.substring(0, loc.lastIndexOf('/'));
      var abs = locDir + '/' + sigmlURL;
      var urlEl = document.getElementById('URLText');
      if (urlEl) urlEl.value = abs;
      return abs;
    }

    function startPlayer(sigmlURL) {
      var abs = setSiGMLURL(sigmlURL);
      try {
        CWASA.playSiGMLURL(abs);
      } catch (e) {
        setStatus(String(e.message || e), true);
        playerAvailableToPlay = true;
      }
    }

    function stopPlayLoop() {
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      try { if (window.CWASA && CWASA.stopSiGML) CWASA.stopSiGML(); } catch (e) {}
    }

    function playTokens(list) {
      stopPlayLoop();
      var words = Array.isArray(list) ? list.filter(Boolean) : [];
      if (!words.length) {
        setGloss('(no matching signs)');
        setStatus('No ISL tokens', true);
        post({ type: 'done' });
        return;
      }
      setGloss(words.join(' · '));
      setStatus('Playing ' + words.length + ' sign(s)…');
      playerAvailableToPlay = true;
      var i = 0;
      playTimer = setInterval(function () {
        if (i >= words.length) {
          if (playerAvailableToPlay) {
            clearInterval(playTimer);
            playTimer = null;
            setCurrent('Done');
            setStatus('Finished ISL sequence');
            post({ type: 'done' });
          }
          return;
        }
        if (!playerAvailableToPlay) {
          var errtext = (document.querySelector('.statusExtra') || {}).value || '';
          if (String(errtext).toLowerCase().indexOf('invalid') !== -1) {
            playerAvailableToPlay = true;
          }
          return;
        }
        playerAvailableToPlay = false;
        var token = words[i];
        setCurrent('Signing: ' + token);
        post({ type: 'gloss', index: i, token: token, total: words.length });
        startPlayer('SignFiles/' + encodeURIComponent(token) + '.sigml');
        i += 1;
      }, 1000);
    }

    window.__neaPlayIsl = function (list) {
      if (!tuavatarLoaded && typeof CWASA === 'undefined') {
        pending = list;
        return;
      }
      playTokens(Array.isArray(list) ? list : []);
    };

    function tokensFromHash() {
      var h = (window.location.hash || '').replace(/^#/, '');
      if (!h) return null;
      try { return JSON.parse(decodeURIComponent(h)); } catch (e) { return null; }
    }
    window.addEventListener('hashchange', function () {
      var list = tokensFromHash();
      if (list) playTokens(list);
    });

    function onHostMessage(raw) {
      try {
        var data = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (data && data.type === 'play') playTokens(data.tokens || []);
      } catch (err) {}
    }
    document.addEventListener('message', function (e) { onHostMessage(e.data); });
    window.addEventListener('message', function (e) { onHostMessage(e.data); });
  </script>
</body>
</html>
